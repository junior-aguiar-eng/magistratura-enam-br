[project]
name = "magistratura-enam-br"
version = "0.6.0"
description = "Ferramentas locais de apoio ao estudo para Magistratura e ENAM."
requires-python = ">=3.14,<3.15"
dependencies = [
    "filelock>=3.20,<4",
    "jsonschema>=4.0",
    "mcp>=2,<3",
    "openpyxl>=3.1",
    "pypdf>=6.16.1",
    "reportlab>=4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "PyYAML>=6.0",
    "ruff>=0.16.1",
]
docs = [
    "mkdocs-awesome-nav>=3.3.0",
    "mkdocs-glightbox>=0.5.2",
    "mkdocs-material>=9.7.5,<10",
    "mkdocstrings[python]>=1.0.6",
    "zensical>=0.0.58,<0.1",
]
