site_name: Estudo Jurídico Avançado
site_description: Fluxos, fontes, questões interativas e arquitetura pedagógica do plugin privado magistratura-enam-br
site_author: Boni Jr
docs_dir: docs/site
site_dir: site
repo_url: https://github.com/junior-aguiar-eng/magistratura-enam-br
repo_name: junior-aguiar-eng/magistratura-enam-br
strict: true

theme:
  name: material
  language: pt-BR
  logo: assets/logo.png
  favicon: assets/logo.png
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Usar tema escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Usar tema claro

plugins:
  - search
  - awesome-nav
  - glightbox
  - tags
  - mkdocstrings:
      handlers:
        python:
          paths:
            - plugins/magistratura-enam-br

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

copyright: Conteúdo privado de Boni Jr. Identificador técnico preservado como magistratura-enam-br.
